name: 01 - Hosted macOS Core AI preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Baseline diagnostics
        run: python3 scripts/preflight.py before-metal
      - name: Install Metal Toolchain
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild -downloadComponent MetalToolchain 2>&1 | tee diagnostics/metal-install.log
      - name: Diagnostics after Metal installation
        if: always()
        run: python3 scripts/preflight.py after-metal
      - name: Preserve all diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-${{ github.run_id }}
          path: diagnostics/
          include-hidden-files: true
          retention-days: 30
