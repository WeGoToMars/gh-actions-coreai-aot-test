name: 05 - Repeat identical d1 vision exports
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: WeGoToMars/gh-actions-coreai-aot-test
          ref: 8d14b46c83fe20636c799fe91be7080a4ff9f44c
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
          enable-cache: false
      - name: Set up locked dependencies
        run: |
          xcodebuild -downloadComponent MetalToolchain
          cd source
          uv sync --locked --python 3.12
      - name: Export same vision model twice
        run: |
          cd source
          uv run --locked python -m tinkerbox_ane.d1.export --vision-only --out artifacts/repro-first
          uv run --locked python -m tinkerbox_ane.d1.export --vision-only --out artifacts/repro-second
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          first=json.loads(Path('artifacts/repro-first/model.json').read_text())['vision_source_hash']
          second=json.loads(Path('artifacts/repro-second/model.json').read_text())['vision_source_hash']
          one=Path('artifacts/repro-first/vision.aimodel')
          two=Path('artifacts/repro-second/vision.aimodel')
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  while block:=f.read(8*1024*1024): h.update(block)
              return h.hexdigest()
          report={'first': first, 'second': second, 'match': first==second,
                  'binary_sha256_first':digest(one/'main.mlirb'), 'binary_sha256_second':digest(two/'main.mlirb'),
                  'binary_size_first':(one/'main.mlirb').stat().st_size,
                  'binary_size_second':(two/'main.mlirb').stat().st_size,
                  'metadata_first':json.loads((one/'metadata.json').read_text()),
                  'metadata_second':json.loads((two/'metadata.json').read_text())}
          Path('../repro-result.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repeated-export-${{ github.run_id }}
          path: repro-result.json
          retention-days: 30
